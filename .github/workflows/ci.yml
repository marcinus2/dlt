name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual deploy from any branch for device testing before merge.
  # The branch must be allowed under Settings → Environments → github-pages.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  poc:
    name: PoC tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drone-lap-poc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: drone-lap-poc/package-lock.json
      - run: npm ci
      - run: npm test

  app:
    name: App checks + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            drone-lap-poc/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: drone-lap-poc
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --coverage
      - name: Build (app + PoC at /poc/)
        run: npm run build:pages
      - name: Bundle budget
        run: npm run size
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: [poc, app]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
