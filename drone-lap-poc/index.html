<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone Lap Counter PoC</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <label>Camera <select id="camera"></select></label>
    <button id="startCamera">Start Camera</button>
    <label>or file <input type="file" id="videoFile" accept="video/*"></label>
    <button id="startDetection" disabled>Start Detection</button>
    <button id="stopDetection" disabled>Stop Detection</button>
    <button id="calibrate" disabled>Calibrate</button>
    <label><input type="checkbox" id="mute"> mute</label>
    <span id="message"></span>
  </header>

  <main>
    <section class="views">
      <figure>
        <figcaption>Camera + ROI</figcaption>
        <canvas id="preview" width="640" height="360"></canvas>
      </figure>
      <figure>
        <figcaption>Diff (ROI)</figcaption>
        <div id="diff"></div>
      </figure>
      <video id="video" playsinline muted hidden></video>
    </section>

    <section class="graph">
      <canvas id="graph" width="900" height="140"></canvas>
    </section>

    <section class="side">
      <pre id="stats"></pre>
      <details open>
        <summary>ROI (relative 0–1)</summary>
        <label>preset <select id="roiPreset"></select></label>
        <div id="roiInputs" class="inputs"></div>
      </details>
      <details open>
        <summary>Config</summary>
        <div id="configInputs" class="inputs"></div>
      </details>
    </section>

    <section class="logs">
      <div>
        <button id="clearLog">Clear</button>
        <button id="exportEvents">Export events CSV</button>
        <button id="exportFrames">Export frames CSV</button>
      </div>
      <div id="log"></div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
